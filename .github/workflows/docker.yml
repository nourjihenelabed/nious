# Builds the Docker image on GitHub's servers on every push, checks that it
# starts, and publishes it to GitHub Packages (ghcr.io) from the main branch.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: axiom-pricing:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check that the engine and the demo start
        run: |
          docker run --rm axiom-pricing:test -c "import sys; sys.path.insert(0, 'src'); import pricing, fastapi, uvicorn; print('engine', pricing.__version__)"
          docker run --rm axiom-pricing:test scripts/run_models.py --help > /dev/null
          docker run --rm axiom-pricing:test demo/server.py --help > /dev/null

      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Publish the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
